<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    </pattern>
    <linearGradient id="bos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#276EF1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#276EF1" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#000"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- Boğaz -->
  <path d="M640 -20 C 600 160, 760 260, 700 420 S 560 640, 640 820 S 860 980, 820 1120" fill="none" stroke="url(#bos)" stroke-width="70" stroke-linecap="round"/>

  <!-- Rota -->
  <path d="M190 980 C 320 980, 330 760, 470 720 S 720 760, 760 560 S 860 330, 900 300" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26"/>
  <path d="M190 980 C 320 980, 330 760, 470 720" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <rect x="166" y="956" width="48" height="48" fill="#fff"/>
  <rect x="182" y="972" width="16" height="16" fill="#000"/>
  <circle cx="900" cy="300" r="28" fill="#fff"/>
  <circle cx="900" cy="300" r="10" fill="#000"/>

  <!-- Araç -->
  <g transform="translate(470 720) rotate(-20)">
    <rect x="-30" y="-17" width="60" height="34" rx="10" fill="#fff"/>
    <rect x="4" y="-12" width="14" height="24" rx="4" fill="#000"/>
    <rect x="-22" y="-12" width="10" height="24" rx="3" fill="#000"/>
  </g>

  <!-- Teslimat çantası -->
  <g transform="translate(720 530)">
    <rect x="-44" y="-44" width="88" height="88" rx="22" fill="#06C167"/>
    <path d="M-20 -6 h40 l-4 30 h-32 z" fill="#000"/>
    <path d="M-10 -6 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#000" stroke-width="5"/>
  </g>

  <!-- Kod -->
  <g transform="translate(330 470)">
    <rect x="-44" y="-44" width="88" height="88" rx="22" fill="#276EF1"/>
    <path d="M-14 -14 l-14 14 l14 14 M14 -14 l14 14 l-14 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Üst bilgi -->
  <text x="80" y="140" fill="#fff" font-size="88" font-weight="700" letter-spacing="-3">Uber</text>
  <rect x="80" y="180" width="330" height="52" rx="26" fill="#fff"/>
  <text x="245" y="215" fill="#000" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="2">KARİYER · TÜRKİYE</text>
  <text x="1000" y="140" fill="#AFAFAF" font-size="26" font-weight="500" text-anchor="end">2026</text>

  <!-- Başlık -->
  <text x="80" y="1110" fill="#fff" font-size="104" font-weight="700" letter-spacing="-4">Yola birlikte</text>
  <text x="80" y="1210" fill="#fff" font-size="104" font-weight="700" letter-spacing="-4">çıkalım<tspan fill="#06C167">.</tspan></text>

  <!-- Alt şerit -->
  <rect x="0" y="1260" width="1080" height="90" fill="#fff"/>
  <text x="80" y="1316" fill="#000" font-size="26" font-weight="600">Teknoloji · Teslimat · Ulaşım · Kurumsal · Operasyon</text>
  <text x="1000" y="1316" fill="#000" font-size="26" font-weight="700" text-anchor="end">Hemen başvur →</text>
</svg>
